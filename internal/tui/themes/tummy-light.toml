# tummy-light: light. Helix format.

"ui.text" = "text"
"ui.text.focus" = { fg = "accent", modifiers = ["bold"] }
"ui.text.inactive" = "dim"
"ui.selection" = { bg = "selection", modifiers = ["bold"] }
"ui.cursor" = { modifiers = ["reversed"] }
"ui.statusline" = "text"
"ui.statusline.key" = { fg = "accent", modifiers = ["bold"] }
"ui.window" = "rule"
"ui.window.focus" = "accent"
"ui.popup" = { fg = "accent", modifiers = ["bold"] }
"ui.menu" = "text"
"ui.menu.selected" = { bg = "selection", modifiers = ["bold"] }

"error" = "red"
"warning" = "yellow"
"info" = "accent"
"hint" = "dim"

"tummy.ok" = "green"
"tummy.header" = { fg = "header", modifiers = ["bold"] }
"tummy.status" = { fg = "text", modifiers = ["italic"] }

[palette]
accent = "#5B4BDB"
dim = "#8A8A8A"
text = "#1A1A1A"
green = "#1F8F4E"
red = "#C23B3B"
yellow = "#B7791F"
selection = "#ECE9FF"
rule = "#D9D9D9"
header = "#5C5C5C"
